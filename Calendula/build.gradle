buildscript {
    repositories {
        mavenCentral()
    }
    apply from: "provider-buildscript.gradle", to: buildscript
}
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'idea'
// build config fields
apply from: 'config.gradle'


repositories {
    mavenCentral()
    google()
    maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
    maven { url 'https://jitpack.io' }
    // material-stepper 3.3.0 was historically published through this repository.
    maven { url 'https://artifactory.appodeal.com/appodeal-public/' }
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

// read keystore for app signing
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = null
if (keystorePropertiesFile.exists()) {
    keystoreProperties = new Properties()
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}


static def getDate() {
    def date = new Date()
    def formattedDate = date.format('yyyy.MM.dd')
    return formattedDate
}

def getCustomProguardFiles() {
    return fileTree(dir: "proguard", include: ["*.pro"]).asList().toArray()
}

android {
    compileSdkVersion 36
    namespace 'es.usc.citius.servando.calendula'

    buildFeatures {
        buildConfig true
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 39
        versionName "2.5.8"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        applicationId "es.usc.citius.servando.calendula"
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
    }

    packagingOptions {
        exclude 'LICENSE.txt'
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties != null ? keystoreProperties['keyAlias'] : null
            keyPassword keystoreProperties != null ? keystoreProperties['keyPassword'] : null
            storeFile keystoreProperties != null ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties != null ? keystoreProperties['storePassword'] : null
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
        unitTests.all {
            jvmArgs += [
                    '--add-opens=java.base/java.lang=ALL-UNNAMED',
                    '--add-opens=java.base/java.util=ALL-UNNAMED',
                    '--add-opens=java.base/java.io=ALL-UNNAMED',
                    '--add-opens=java.base/java.net=ALL-UNNAMED',
                    '--add-opens=java.base/java.security=ALL-UNNAMED',
                    '--add-opens=java.base/java.text=ALL-UNNAMED',
                    '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED',
                    '--add-opens=java.desktop/java.awt.font=ALL-UNNAMED',
                    '--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED'
            ]
        }
    }


    lintOptions {
        // Keep the legacy warning backlog visible, but never allow new lint
        // Error/Fatal findings to pass CI silently.
        abortOnError true
        checkReleaseBuilds false
    }

    flavorDimensions "buildType"

    productFlavors {
        develop {
            applicationIdSuffix ".dev"
            dimension "buildType"
            minSdkVersion 23
        }
        product {
            dimension "buildType"
        }
        ci {
            dimension "buildType"
            minSdkVersion 23
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt')
            proguardFiles getCustomProguardFiles()
            testProguardFiles getDefaultProguardFile('proguard-android.txt')
            testProguardFiles getCustomProguardFiles()
            productFlavors.develop.signingConfig signingConfigs.release
            ndk {
                abiFilters "arm64-v8a", "armeabi-v7a", "x86_64", "x86"
            }
        }
        debug {
            debuggable true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt')
            proguardFiles getCustomProguardFiles()
            testProguardFiles 'android-test-proguard.pro'
            testCoverageEnabled true
            ndk {
                abiFilters "arm64-v8a", "armeabi-v7a", "x86_64", "x86"
            }
        }
        beta {
            minifyEnabled false
            versionNameSuffix "-build" + getDate()
            matchingFallbacks = ['debug']
        }
        alpha {
            minifyEnabled false
            applicationIdSuffix ".alpha"
            signingConfig signingConfigs.release
            versionNameSuffix "-" + getDate()
            matchingFallbacks = ['debug']
        }
    }


    compileOptions {
        sourceCompatibility = 1.8
        targetCompatibility = 1.8
    }

//    splits {
//
//        abi {
//            enable true
//            reset()
//            include "armeabi-v7a", "arm64-v8a"
//            universalApk true
//        }
//    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "${project.name}-${variant.name}-${output.getFilter(com.android.build.OutputFile.ABI)}-${variant.versionName}.apk"
        }
    }
    compileOptions.incremental = false
}


tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile) {
    kotlinOptions {
        jvmTarget = '1.8'
        allWarningsAsErrors = true
    }
}

dependencies {

    /********** DEBUGGING **********/
    // Chrome debug bridge
    debugImplementation 'com.facebook.stetho:stetho:1.6.0'

    // Memory leak debugging (LeakCanary 2 auto-installs in debug builds.)
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'

    /********** SUPPORT **********/
    // Multidex support
    implementation 'androidx.multidex:multidex:2.0.1'

    // Support libs
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.0.0'
    implementation 'androidx.gridlayout:gridlayout:1.1.0'
    implementation 'androidx.palette:palette-ktx:1.0.0'
    implementation 'androidx.preference:preference-ktx:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'androidx.annotation:annotation:1.11.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.legacy:legacy-preference-v14:1.0.0'

    // Testing dependencies
    //  Made explicit to avoid conflicts with other testing libs
    androidTestImplementation 'androidx.appcompat:appcompat:1.8.0'
    androidTestImplementation 'com.google.android.material:material:1.0.0'
    androidTestImplementation 'androidx.recyclerview:recyclerview:1.1.0'
    androidTestImplementation 'androidx.annotation:annotation:1.11.0'
    androidTestImplementation 'androidx.annotation:annotation-experimental:1.1.0'
    androidTestImplementation 'androidx.legacy:legacy-support-v4:1.0.0'

    /********** TESTING **********/
    // JUnit
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test:core:1.4.0'

    // Mockito
    testImplementation "org.mockito:mockito-inline:$libVersions.mockito"

    // Support testing
    androidTestImplementation('androidx.test.espresso:espresso-contrib:3.4.0') {
        exclude group: 'com.google.android.apps.common.testing.accessibility.framework', module: 'accessibility-test-framework'
    }
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    androidTestImplementation 'androidx.test:rules:1.4.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'

    // Robolectric
    testImplementation "org.robolectric:robolectric:$libVersions.robolectric"

    /********** UTILITIES **********/
    // HTML parsing
    implementation 'org.jsoup:jsoup:1.10.3'

    // Event bus
    implementation 'org.greenrobot:eventbus:3.3.1'

    // Jobs
    implementation 'com.evernote:android-job:1.4.3'

    // JSON serializing-deserializing
    implementation 'com.google.code.gson:gson:2.8.9'

    // Lang utilities
    //  Used for Levenshtein distance, etc
    implementation 'org.apache.commons:commons-lang3:3.6'
    implementation 'org.apache.commons:commons-text:1.1'

    // QR code scanning
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'com.journeyapps:zxing-android-embedded:3.6.0@aar'

    // Recurrence processing
    implementation 'org.dmfs:lib-recur:0.10.3'

    // SQLite ORM
    implementation 'com.j256.ormlite:ormlite-android:5.0'

    // Time and date handling
    implementation 'com.fatboyindustrial.gson-jodatime-serialisers:gson-jodatime-serialisers:1.8.0'
    implementation 'joda-time:joda-time:2.14.4'

    // View/resource binding
    kapt "com.jakewharton:butterknife-compiler:$libVersions.butterknife"
    implementation "com.jakewharton:butterknife:$libVersions.butterknife"

    /********** VIEWS AND VIEW UTILITIES **********/
    // About page with libraries
    implementation("com.mikepenz:aboutlibraries:${latestAboutLibsRelease}") {
        transitive = true
    }

    // Calendar views
    implementation 'com.roomorama:caldroid:3.0.1'
    implementation 'com.squareup:android-times-square:1.7.11@aar'

    // Circular progress "pie" view
    //  Used for pill picker
    implementation 'com.github.filippudak.progresspieview:library:1.0.4'

    // Dialogs with material style
    implementation 'com.github.javiersantos:MaterialStyledDialogs:2.0'

    // GIF ImageView
    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.32'

    // Icons
    implementation 'com.mikepenz:community-material-typeface:2.7.94.1@aar'
    implementation 'com.mikepenz:google-material-typeface:2.2.0.1@aar'
    implementation 'com.mikepenz:iconics-core:3.2.5@aar'
    implementation 'com.mikepenz:iconics-views:3.2.5@aar'

    // Image loading
    implementation 'com.squareup.picasso:picasso:2.71828'

    // Intro slides
    implementation 'com.heinrichreimersoftware:material-intro:1.5.8'

    // Material style utilities
    implementation('com.mikepenz:materialize:1.2.1@aar') {
        transitive = true
    }

    // Picker DialogFragments
    implementation 'com.code-troopers.betterpickers:library:3.1.0'

    // Round image view
    implementation 'com.makeramen:roundedimageview:2.3.0'

    // Tab strip
    implementation 'com.astuetz:pagerslidingtabstrip:1.0.1'

    // Sliding left drawer
    implementation('com.mikepenz:materialdrawer:6.1.0@aar') {
        transitive = true
    }
    // Material Drawer dependencies
    implementation "androidx.constraintlayout:constraintlayout:1.1.3"
//    implementation "androidx.drawerlayout:drawerlayout:1.0.0"

    // Recyclerview adapters
    implementation('com.mikepenz:fastadapter:3.3.1@aar') {
        transitive = true
    }
    implementation 'com.mikepenz:fastadapter-commons:3.3.1@aar'
    implementation 'com.mikepenz:fastadapter-extensions:3.3.1@aar'
    implementation 'com.mikepenz:fastadapter-extensions-expandable:3.3.1@aar'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    // Secured preferences
    implementation 'com.github.TonyTangAndroid:Secured-Preference-Store:0.5.4'


    // Schedule step-by-step building
    implementation 'com.stepstone.stepper:material-stepper:3.3.0'
    implementation 'com.wdullaer:materialdatetimepicker:3.6.4'
    implementation 'com.github.ShawnLin013:NumberPicker:v2.4.6'


}

apply from: 'provider.gradle'
