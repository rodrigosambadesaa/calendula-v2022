apply plugin: 'org.sonarqube'

sonarqube {
    properties {
        def libraries = project.android.sdkDirectory.getPath() + "/platforms/android-25/android.jar"
        def classes = "build/intermediates/classes/ci/debug,build/tmp/kotlin-classes/ciDebug"

        property "sonar.sources", "src/main/java"
        // Defines where the java files are
        property "sonar.binaries", classes
        property "sonar.libraries", libraries
        // Defines where the xml files are
        property "sonar.java.binaries", classes
        property "sonar.java.libraries", libraries

        property "sonar.tests", "src/test/java, src/androidTest/java"

        property "sonar.java.test.binaries", classes + ",build/tmp/kotlin-classes/ciDebugUnitTest"
        property "sonar.java.test.libraries", libraries

        property "sonar.jacoco.reportPath", "build/jacoco/testCiDebugUnitTest.exec"
        property "sonar.java.coveragePlugin", "jacoco"
        property "sonar.junit.reportsPath", "build/test-results/testCiDebugUnitTest"
        property "sonar.android.lint.report", "build/outputs/lint-results.xml"

        property "sonar.java.source", 6
    }
}

