version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # Keep major AndroidX/UI migrations explicit. The project now has a modern
      # SDK/toolchain baseline, but these jumps can still require coordinated source changes.
      - dependency-name: "androidx.constraintlayout:constraintlayout"
        update-types: ["version-update:semver-major"]
      - dependency-name: "androidx.preference:preference"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "androidx.appcompat:appcompat"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "androidx.recyclerview:recyclerview"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "com.google.android.material:material"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

      # Keep the AndroidX Test stack coordinated instead of allowing isolated upgrades
      # that can pull mismatched runner/core/espresso versions.
      - dependency-name: "androidx.test:rules"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "androidx.test.ext:junit"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "androidx.test:core"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "androidx.test.espresso:espresso-contrib"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "androidx.test.espresso:espresso-core"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

      # Major library migrations remain deliberate because they change APIs or artifact layout.
      - dependency-name: "com.mikepenz:fastadapter*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.mikepenz:community-material-typeface"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.google.code.gson:gson"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.jsoup:jsoup"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.mockito:mockito-inline"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.mockito:mockito-android"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.evernote:android-job"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.facebook.stetho:stetho"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.apache.commons:commons-lang3"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.apache.commons:commons-text"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.google.zxing:core"
        update-types: ["version-update:semver-major"]

      # lib-recur uses 0.x versioning; minor jumps can include breaking API/runtime changes.
      - dependency-name: "org.dmfs:lib-recur"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

      # Compiler/build-system major versions require coordinated AGP/Gradle/JDK validation.
      - dependency-name: "kotlin_version"
        update-types: ["version-update:semver-major"]
      - dependency-name: "gradle-wrapper"
        versions: [">=9.0"]
      - dependency-name: "com.google.gms:google-services"
        update-types: ["version-update:semver-major"]

      # Keep major Android library migrations explicit even though the API-23 floor no longer
      # requires the old API-18-specific holds.
      - dependency-name: "pl.droidsonroids.gif:android-gif-drawable"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.journeyapps:zxing-android-embedded"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.squareup:android-times-square"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.mikepenz:iconics-core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.mikepenz:iconics-views"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.wdullaer:materialdatetimepicker"
        update-types: ["version-update:semver-major"]

      # ORMLite 5.7 already changes the Dao API used by this codebase; keep it on the
      # currently validated line until that persistence migration is handled explicitly.
      - dependency-name: "com.j256.ormlite:ormlite-android"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
