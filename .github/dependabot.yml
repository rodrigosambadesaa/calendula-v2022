version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # These AndroidX releases raise their minimum SDK to 21, while this
      # historical branch intentionally preserves minSdk 18 for now.
      - dependency-name: "androidx.gridlayout:gridlayout"
        versions: ["1.1.0"]
      - dependency-name: "androidx.constraintlayout:constraintlayout"
        update-types: ["version-update:semver-major"]
      # FastAdapter 5.x is a major API/artifact-layout migration. Keep the
      # legacy 3.x family until it is migrated deliberately in a dedicated PR.
      - dependency-name: "com.mikepenz:fastadapter*"
        update-types: ["version-update:semver-major"]
      # Kotlin 2.x requires a coordinated AGP/Gradle/JDK migration.
      - dependency-name: "kotlin_version"
        update-types: ["version-update:semver-major"]
      # Newer google-services plugin releases require a newer Java/Gradle toolchain.
      - dependency-name: "com.google.gms:google-services"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # 1.2.32 raises the Android minimum SDK to 21.
      - dependency-name: "pl.droidsonroids.gif:android-gif-drawable"
        versions: ["1.2.32"]
      # 4.3.0 raises the Android minimum SDK from 18 to 19.
      - dependency-name: "com.journeyapps:zxing-android-embedded"
        versions: ["4.3.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
