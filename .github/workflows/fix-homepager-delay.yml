name: One-time HomePager delay repair

on:
  push:
    branches:
      - modernization/agp-8-1-toolchain

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7

      - name: Restore integer delay argument
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('Calendula/src/main/java/es/usc/citius/servando/calendula/HomePagerActivity.java')
          text = path.read_text()
          marker = 'public void launchActivityDelayed(final Class<?> activityClazz, int delay)'
          start = text.index(marker)
          prefix = text[:start]
          suffix = text[start:]
          old = '        }, delay ? 500 : 0);'
          new = '        }, delay);'
          if old not in suffix:
              raise SystemExit('Target expression not found in launchActivityDelayed')
          path.write_text(prefix + suffix.replace(old, new, 1))
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Calendula/src/main/java/es/usc/citius/servando/calendula/HomePagerActivity.java
          git commit -m "fix: preserve delayed activity duration"
          git push origin HEAD:modernization/agp-8-1-toolchain
