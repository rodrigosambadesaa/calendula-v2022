name: Merge verified owner PRs

# Only the workflow stored on the default branch runs with write permissions.
# Never check out, source, or execute code from the pull request here.
on:
  workflow_run:
    workflows:
      - Android CI
      - Android emulator smoke (API 23, 33, 36)
      - Android 17 runtime compatibility (API 37.0)
    types:
      - completed
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report eligible pull requests without merging
        type: boolean
        default: true

permissions:
  # Explicit workflow_dispatch is needed after a GITHUB_TOKEN squash merge:
  # GitHub suppresses ordinary push-triggered runs from that token.
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: verified-owner-pr-merges
  cancel-in-progress: false

jobs:
  merge:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge only explicitly opted-in owner branches with all Android CI suites green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          owner="${REPO%%/*}"

          # The opt-in is a '[automerge] ' title AND a modernize/* branch
          # from the repository owner's account (not a fork or bot).
          gh api "repos/$REPO/pulls?state=open&per_page=100" |
          jq -c --arg owner "$owner" '
            .[] | select(
              .base.ref == "main"
              and (.draft == false)
              and .head.repo.full_name == .base.repo.full_name
              and .user.login == $owner
              and (.head.ref | startswith("modernize/"))
              and (.title | startswith("[automerge] "))
            ) | {number, sha: .head.sha, branch: .head.ref}
          ' | while IFS= read -r pr; do
            number=$(jq -r '.number' <<< "$pr")
            sha=$(jq -r '.sha' <<< "$pr")
            branch=$(jq -r '.branch' <<< "$pr")

            # Query immutable commit SHA, not potentially moving branch status.
            runs=$(gh api "repos/$REPO/actions/runs?head_sha=$sha&per_page=100")
            all_green=true
            for workflow in "Android CI" "Android emulator smoke (API 23, 33, 36)" "Android 17 runtime compatibility (API 37.0)"; do
              latest=$(jq -r --arg workflow "$workflow" --arg branch "$branch" --arg sha "$sha" '
                [.workflow_runs[] | select(
                  .name == $workflow and .head_branch == $branch and .head_sha == $sha
                )] | sort_by(.created_at, .id) | last | .conclusion // "missing"
              ' <<< "$runs")
              if [[ "$latest" != success ]]; then
                echo "PR #$number: waiting for $workflow (latest: $latest)"
                all_green=false
              fi
            done

            if [[ "$all_green" != true ]]; then
              continue
            fi

            # Recheck identity and head just before the write. The merge endpoint
            # also rejects a changed head commit via the sha precondition.
            current=$(gh api "repos/$REPO/pulls/$number")
            if ! jq -e --arg owner "$owner" --arg sha "$sha" '
                .state == "open" and .base.ref == "main"
                and (.draft == false)
                and .head.repo.full_name == .base.repo.full_name
                and .user.login == $owner
                and (.head.ref | startswith("modernize/"))
                and (.title | startswith("[automerge] "))
                and .head.sha == $sha
              ' <<< "$current" >/dev/null; then
              echo "PR #$number changed while checking; skipping"
              continue
            fi

            # A green PR head may have been tested against an older main.
            # Require the exact head commit to contain today's main before
            # trusting those check results for automatic integration.
            # This intentionally makes old approved PRs wait for an update.
            comparison=$(gh api "repos/$REPO/compare/main...$sha")
            if ! jq -e '
                .behind_by == 0
                and (.status == "ahead" or .status == "identical")
              ' <<< "$comparison" >/dev/null; then
              echo "PR #$number is behind main; update and re-run all three CI suites"
              continue
            fi

            if [[ "$EVENT_NAME" == workflow_dispatch && "$DRY_RUN" != false ]]; then
              echo "Dry run: PR #$number is eligible for squash merge"
              continue
            fi

            echo "Squash-merging verified PR #$number at $sha"
            merge_result=$(gh api --method PUT "repos/$REPO/pulls/$number/merge" \
              -f sha="$sha" -f merge_method=squash)
            merged_sha=$(jq -er 'select(.merged == true) | .sha' <<< "$merge_result")
            # A push created with GITHUB_TOKEN does not trigger the normal
            # push workflows. Explicit workflow_dispatch *does* trigger them.
            # Dispatch only after a confirmed merge, and always test main,
            # not the old PR head. CI records the actual merged SHA.
            current_main=$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')
            if [[ "$current_main" != "$merged_sha" ]]; then
              echo "::warning::main advanced after merging PR #$number; dispatching checks for latest main"
            fi
            echo "Dispatching post-merge Android checks for main (current: $current_main)"
            gh workflow run android-ci.yml --repo "$REPO" --ref main
            gh workflow run android-emulator-smoke.yml --repo "$REPO" --ref main
            gh workflow run android-17-compatibility.yml --repo "$REPO" --ref main
          done
