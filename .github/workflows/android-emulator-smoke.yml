name: Android emulator smoke (API 23, 33, 36)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/android-emulator-smoke.yml'
      - 'Calendula/**'
      - 'scripts/android-smoke-tests.sh'
      - 'scripts/android-smoke-classes.d/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/wrapper/**'

permissions:
  contents: read

concurrency:
  group: android-emulator-smoke-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  smoke:
    strategy:
      fail-fast: false
      # Run emulator jobs serially so the first job populates the shared Gradle
      # dependency cache instead of three cold runners hammering Maven Central at once.
      max-parallel: 1
      matrix:
        api-level: [23, 33, 36]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Resolve Gradle build tooling
        run: |
          for attempt in 1 2 3; do
            if ./gradlew help --stacktrace --no-daemon; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done

      # sdkmanager occasionally fails to extract the emulator ZIP on hosted
      # runners before any instrumentation test begins. Validate installation
      # here and retry cleanly instead of interpreting this as an app failure.
      - name: Install emulator tooling with verification and retries
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3 4; do
            echo "Verify Android Emulator tooling (attempt $attempt/4)"
            if "$MANAGER" --install emulator && \
               test -x "$SDK/emulator/emulator"; then
              # Some emulator builds return nonzero from the CLI -version
              # probe despite a valid executable. Do not delete a healthy
              # installation based only on that diagnostic.
              "$SDK/emulator/emulator" -version || true
              exit 0
            fi
            echo "::warning::Android Emulator installation incomplete; retrying."
            if [ "$attempt" -lt 4 ]; then
              rm -rf "$SDK/emulator"
              sleep $((attempt * 10))
            fi
          done
          echo "::error::Android Emulator install failed before tests; no app regression asserted"
          exit 1

      # Emulator-runner's image download is not retried, and transient ZIP
      # corruption on API 36 previously failed before any test was started.
      # Install and verify the exact requested system image beforehand.
      - name: Preinstall API ${{ matrix.api-level }} system image with retries
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          API="${{ matrix.api-level }}"
          IMAGE="$SDK/system-images/android-$API/google_apis/x86_64"
          PACKAGE="system-images;android-$API;google_apis;x86_64"
          for attempt in 1 2 3 4; do
            echo "Verify API $API system image (attempt $attempt/4)"
            if "$MANAGER" --install "$PACKAGE" && \
               test -f "$IMAGE/package.xml" && \
               test -f "$IMAGE/system.img"; then
              echo "Android API $API system image verified."
              exit 0
            fi
            echo "::warning::API $API system image installation incomplete"
            if [ "$attempt" -lt 4 ]; then
              rm -rf "$IMAGE"
              sleep $((attempt * 12))
            fi
          done
          echo "::error::Could not install Android API $API image; no app tests executed"
          exit 1

      - name: Enable hardware acceleration for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run smoke tests on API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          script: bash scripts/android-smoke-tests.sh

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-api-${{ matrix.api-level }}-smoke-results
          path: |
            Calendula/build/reports/androidTests/connected/
            Calendula/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
          retention-days: 7
