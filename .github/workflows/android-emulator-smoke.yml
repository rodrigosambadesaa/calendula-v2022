name: Android emulator smoke (API 23, 33, 36)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/android-emulator-smoke.yml'
      - 'Calendula/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/wrapper/**'

permissions:
  contents: read

concurrency:
  group: android-emulator-smoke-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        api-level: [23, 33, 36]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Enable hardware acceleration for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run smoke tests on API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          script: ./gradlew connectedCiDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=es.usc.citius.servando.calendula.InstallationSmokeTest --stacktrace --no-daemon

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-api-${{ matrix.api-level }}-smoke-results
          path: |
            Calendula/build/reports/androidTests/connected/
            Calendula/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
          retention-days: 7
