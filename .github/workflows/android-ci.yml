name: Android CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  # A push and the corresponding pull_request event should share the same group.
  group: android-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: modernization/compile-sdk-33

      - name: Apply API 33 WebView compatibility cleanup
        if: github.head_ref == 'modernization/compile-sdk-33' || github.ref_name == 'modernization/compile-sdk-33'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('Calendula/src/main/java/es/usc/citius/servando/calendula/activities/PdfViewActivity.java'),
              Path('Calendula/src/main/java/es/usc/citius/servando/calendula/activities/WebViewActivity.java'),
          ]
          obsolete = [
              '        webView.getSettings().setAppCachePath(getFilesDir().getPath() + "data/" + getPackageName() + "/cache");\n',
              '        webView.getSettings().setAppCacheEnabled(true);\n',
          ]
          for path in files:
              text = path.read_text()
              for line in obsolete:
                  count = text.count(line)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one occurrence of {line.strip()!r}, found {count}')
                  text = text.replace(line, '')
              path.write_text(text)
          PY
          if git diff --quiet -- Calendula/src/main/java/es/usc/citius/servando/calendula/activities/PdfViewActivity.java Calendula/src/main/java/es/usc/citius/servando/calendula/activities/WebViewActivity.java; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Calendula/src/main/java/es/usc/citius/servando/calendula/activities/PdfViewActivity.java Calendula/src/main/java/es/usc/citius/servando/calendula/activities/WebViewActivity.java
          git commit -m "Remove obsolete WebView AppCache APIs [skip ci]"
          git push origin HEAD:modernization/compile-sdk-33

      - name: Set up JDK 17 for Android SDK tools
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 33
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-33" "build-tools;30.0.3"

      - name: Set up JDK 11 for Gradle and KAPT
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Build CI debug APK
        run: |
          set -o pipefail
          ./gradlew assembleCiDebug --stacktrace --no-daemon 2>&1 | tee gradle-build.log

      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-gradle-build-log
          path: gradle-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Run unit tests
        run: ./gradlew testCiDebugUnitTest --stacktrace --no-daemon

      - name: Build instrumentation test APK
        run: ./gradlew -Dorg.gradle.jvmargs=-Xmx3072m assembleCiDebugAndroidTest --stacktrace --no-daemon

      - name: Run Android lint
        run: ./gradlew lintCiDebug --stacktrace --no-daemon

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-unit-test-reports
          path: |
            Calendula/build/reports/tests/testCiDebugUnitTest/
            Calendula/build/test-results/testCiDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-lint-reports
          path: Calendula/build/reports/lint-results-*
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload CI debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Calendula-ci-debug
          path: Calendula/build/outputs/apk/ci/debug/*.apk
          if-no-files-found: error
          retention-days: 7
