name: Android CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # A push and the corresponding pull_request event should share the same group.
  group: android-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17 for Android SDK tools
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 29
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-29" "build-tools;29.0.3"

      - name: Set up JDK 8 for legacy Gradle
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle

      - name: Build CI debug APK
        run: ./gradlew assembleCiDebug --stacktrace --no-daemon

      - name: Run unit tests
        run: ./gradlew testCiDebugUnitTest --stacktrace --no-daemon

      - name: Build instrumentation test APK
        run: ./gradlew -Dorg.gradle.jvmargs=-Xmx3072m assembleCiDebugAndroidTest --stacktrace --no-daemon

      - name: Run Android lint
        run: ./gradlew lintCiDebug --stacktrace --no-daemon

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-unit-test-reports
          path: |
            Calendula/build/reports/tests/testCiDebugUnitTest/
            Calendula/build/test-results/testCiDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-lint-reports
          path: Calendula/build/reports/lint-results-*
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload CI debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Calendula-ci-debug
          path: Calendula/build/outputs/apk/ci/debug/*.apk
          if-no-files-found: error
          retention-days: 7
