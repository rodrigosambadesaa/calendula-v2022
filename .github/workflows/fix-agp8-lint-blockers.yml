name: One-time AGP 8 lint blocker repair

on:
  push:
    branches:
      - modernization/agp-8-1-toolchain

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7

      - name: Repair lint blockers
        run: |
          python - <<'PY'
          from pathlib import Path

          java = Path('Calendula/src/main/java/es/usc/citius/servando/calendula/DailyAgendaRecyclerAdapter.java')
          text = java.read_text()
          old = '''                if(el.eventId ==ev.getId())
                el.taken = ev.completed();'''
          new = '''                if (el.eventId == ev.getId()) {
                    el.taken = ev.completed();
                }'''
          if old not in text:
              raise SystemExit('DailyAgendaRecyclerAdapter lint target not found')
          java.write_text(text.replace(old, new, 1))

          xml = Path('Calendula/src/main/res/values/strings_provider_untranslatable.xml')
          text = xml.read_text()
          old_root = '<resources>'
          new_root = '<resources xmlns:tools="http://schemas.android.com/tools">'
          if old_root not in text:
              raise SystemExit('Resource root target not found')
          text = text.replace(old_root, new_root, 1)
          old_plural = '    <plurals name="intakes_per_day">'
          new_plural = '''    <!-- Structural plural: localized text comes from the referenced strings. -->
    <plurals name="intakes_per_day" tools:ignore="MissingTranslation">'''
          if old_plural not in text:
              raise SystemExit('Plural lint target not found')
          xml.write_text(text.replace(old_plural, new_plural, 1))
          PY

      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Calendula/src/main/java/es/usc/citius/servando/calendula/DailyAgendaRecyclerAdapter.java Calendula/src/main/res/values/strings_provider_untranslatable.xml
          git commit -m "lint: fix AGP 8 blocking findings"
          git push origin HEAD:modernization/agp-8-1-toolchain
